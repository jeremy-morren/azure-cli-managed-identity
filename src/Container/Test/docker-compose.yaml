name: msi

services:
  managed-identity:
    build:
      context: ../../../
      dockerfile: src/Container/Test/Dockerfile.linux
    volumes:
      - "${AZURE_CONFIG_DIR:-${USERPROFILE:-~}/.azure}:/.azure:ro"
    ports:
      - '11430:80/tcp'
    cpu_count: 1
    mem_limit: 64m

  test-api:
    build:
      context: TestApi/
      dockerfile: Dockerfile
    ports:
      - '8081:8080/tcp'
    environment:
      MSI_ENDPOINT: 'http://managed-identity/token'
    cpus: '0.5'
    mem_limit: 128m